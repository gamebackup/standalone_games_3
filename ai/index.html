#chat {
  scrollbar-width: thin;
  scrollbar-color: #2a3142 transparent;   
}

#chat::-webkit-scrollbar {
  width: 10px;
}
#chat::-webkit-scrollbar-track {
  background: transparent;
}
#chat::-webkit-scrollbar-thumb {
  background: #2a3142;
  border-radius: 999px;
  border: 2px solid transparent;         
  background-clip: content-box;
  transition: background .15s;
}
#chat::-webkit-scrollbar-thumb:hover {
  background: #3a4258;
  background-clip: content-box;
}
#chat::-webkit-scrollbar-thumb:active {
  background: #4a5470;
  background-clip: content-box;
}
  .msg {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.45; font-size: 15px; white-space: pre-wrap; word-wrap: break-word;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .user { align-self: flex-end; background: #e61587; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #1b202b; border: 1px solid #252c3a; border-bottom-left-radius: 4px; }
  .bot.typing { color: #8a92a6; letter-spacing: 3px; }
  .msg a { color: #ff8ac4; text-decoration: underline; text-underline-offset: 2px; }
  .msg a:hover { color: #ffb3d9; }
  .qr-code { display: inline-block; background: #fff; padding: 8px; border-radius: 8px; }
  .qr-code svg { display: block; width: 180px; height: 180px; }
  .msg img.barcode { display: block; max-width: 100%; background: #fff; padding: 8px; border-radius: 8px; }
  form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #1e2431; background: #0f1219; }
  #input {
    flex: 1; padding: 13px 15px; border-radius: 12px; border: 1px solid #262d3b;
    background: #161b25; color: #e6e8ee; font-size: 15px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  #input:focus { border-color: #e61587; box-shadow: 0 0 0 3px rgba(117, 11, 69, 1); }
  button {
    padding: 0 22px; border-radius: 12px; border: none; cursor: pointer;
    background: linear-gradient(180deg, #e61587, #e61587); color: #ffffff;
    font-size: 15px; font-weight: 600;
  }
  button:active { transform: translateY(1px); }

function norm(s) {
  return s
    .toLowerCase()
    .replace(/[\u2018\u2019']/g, "")        
    .replace(/\s*([+\-*=])\s*/g, "$1")    
    .replace(/[^a-z0-9\s+\-*=]/g, " ")      
    .replace(/\s+/g, " ")
    .trim();
}

function escapeRe(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

// Pre-normalize every trigger phrase once
KB.forEach(g => { g.np = g.p.map(norm); });

function scorePattern(input, pat) {
  // 1. Exact match
  if (input === pat) return 1000 + pat.length;

  // 2. Input contains the whole phrase
  if (new RegExp("(^|\\s)" + escapeRe(pat) + "(\\s|$)").test(input)) {
    return 300 + pat.length * 2;
  }

  // 3. Input is a short fragment of a longer phrase ("joke" vs "tell me a joke")
  if (input.length >= 3 &&
      new RegExp("(^|\\s)" + escapeRe(input) + "(\\s|$)").test(pat)) {
    return 45 + Math.min(input.length, 15);
  }

  // 4. Word overlap ("how are you doing today" vs "how are you doing")
  const it = new Set(input.split(" "));
  const pt = pat.split(" ").filter(Boolean);
  if (pt.length < 2) return 0;
  let shared = 0;
  for (const t of pt) if (it.has(t)) shared++;
  const ratio = shared / pt.length;
  if (shared >= 2 && ratio >= 0.75) {
    return 40 * ratio + Math.min(pat.length, 25) + (ratio === 1 ? 10 : 0);
  }
  return 0;
}

// Remember the last reply per group so it doesn't repeat itself
const lastPick = new Map();
function pick(arr, key) {
  if (arr.length === 1) return arr[0];
  let i, prev = lastPick.get(key);
  do { i = Math.floor(Math.random() * arr.length); } while (i === prev);
  lastPick.set(key, i);
  return arr[i];
}

function looksLikeMath(raw) {
  const s = raw.trim();
  if (!s) return false;
  if (!/[0-9]/.test(s)) return false;
  return /[+\-*/^=()]/.test(s) ||
         /(sin|cos|tan|log|ln|sqrt|diff|integrate|solve)\s*\(/i.test(s);
}

function cleanMathInput(raw) {
  let s = raw.trim().replace(/\?+\s*$/, "").trim();
  s = s.replace(/^(what\s+is|whats|what's|calculate|compute|evaluate|solve|math:?)\s+/i, "");
  s = s.replace(/\s+please$/i, "");
  return s.trim();
}

function tryMath(raw) {
  if (typeof nerdamer === "undefined") return null;
  if (!looksLikeMath(raw)) return null;

  const expr = cleanMathInput(raw);
  if (!expr) return null;

  try {
    // If it is an equation with a variable, try solving it for x.
    if (expr.includes("=") && /[a-z]/i.test(expr) && typeof nerdamer.solve === "function") {
      const solutions = nerdamer.solve(expr, "x").toString();
      if (solutions && solutions !== "[]") return solutions;
    }

    // Otherwise evaluate the expression.
    const result = nerdamer(expr).evaluate().text();
    if (result && result !== "") return result;
  } catch (e) {
    // Last-chance fallback: try the raw input as-is.
    try {
      const result = nerdamer(raw.trim()).evaluate().text();
      if (result && result !== "") return result;
    } catch (_) {}
  }

  return null;
}

function mathLine(arg, out) {
  return `🔢 ${arg} = ${out}`;
}

function plainNumbers(arg) {
  const parts = arg.split(/[\s,]+/).filter(Boolean);
  if (parts.length >= 2 && parts.every(p => /^-?\d+(\.\d+)?$/.test(p))) return parts;
  return null;
}

function runMath(arg, usage, op, format) {
  if (!arg) return `Give me an expression. Usage: ${usage}`;
  if (typeof nerdamer === "undefined") {
    return "My math engine did not load. Check your connection and reload the page.";
  }
  try {
    const out = String(op(arg)).trim();
    if (!out || out === "null" || out === "undefined" || out === "[]") {
      throw new Error("empty result");
    }
    return (format || mathLine)(arg, out);
  } catch (e) {
    return `I could not work that out. Usage: ${usage}`;
  }
}

function formatNum(value, digits) {
  if (!Number.isFinite(value)) return String(value);
  const places = digits === undefined ? 6 : digits;
  return String(Number(value.toPrecision(places)));
}

function parseNumberList(arg) {
  const parts = arg.split(/[\s,]+/).filter(Boolean);
  if (!parts.length) return null;
  if (parts.some(p => !/^-?\d+(?:\.\d+)?$/.test(p))) return null;
  return parts.map(Number);
}

function moonPhaseName(angle) {
  const names = ["New Moon", "Waxing Crescent", "First Quarter", "Waxing Gibbous", "Full Moon", "Waning Gibbous", "Last Quarter", "Waning Crescent"];
  const normalized = ((angle % 360) + 360) % 360;
  return names[Math.round(normalized / 45) % 8];
}

  if (!match) return "Usage: /convert 5 km mi";
  try {
    const result = math.unit(Number(match[1]), match[2]).to(match[3]);
    return `🔢 ${match[1]} ${match[2]} = ${math.format(result, { precision: 6 })}`;
  } catch (e) {
    return "I could not convert that. Usage: /convert 5 km mi";
  }
}

const COMMAND_MAP = {};
for (const c of COMMANDS) {
  COMMAND_MAP[c.name] = c;
  for (const alias of c.aliases || []) COMMAND_MAP[alias] = c;
}

function runCommand(raw) {
  const text = raw.trim();
  if (!text.startsWith("/")) return null;

  const match = text.match(/^\/([a-z]+)\s*:?\s*(.*)$/i);
  if (!match) return "Type a command after the slash. Try /help.";

  const name = match[1].toLowerCase();
  const arg = match[2].trim();
  const cmd = COMMAND_MAP[name];
  if (!cmd) return `I do not know /${name}. Try /help to see every command.`;
  return cmd.run(arg);
}

function findResponse(raw) {
  // 1. Slash commands always win.
  const commandAnswer = runCommand(raw);
  if (commandAnswer !== null) return commandAnswer;

  // 2. Try math next.
  const mathAnswer = tryMath(raw);
  if (mathAnswer !== null) return `🔢 ${mathAnswer}`;

  // 3. Then use the lookup table.
  const input = norm(raw);
  if (!input) return "You typed nothing. Bold move.";

  let bestScore = 0, bestGroup = null;
  for (const g of KB) {
    for (const pat of g.np) {
      const s = scorePattern(input, pat);
      if (s > bestScore) { bestScore = s; bestGroup = g; }
    }
  }

  if (bestGroup && bestScore >= 35) return pick(bestGroup.r, bestGroup);

  const pool = /\?\s*$/.test(raw) ? QUESTION_FALLBACKS : GENERIC_FALLBACKS;
  return pool[Math.floor(Math.random() * pool.length)];
}

  const cleaned = norm(text);
  const words = cleaned.split(" ").filter(Boolean);
  if (words.length < 3 || cleaned.length < 12) return;

  recentBotMessages.push(cleaned);
  if (recentBotMessages.length > MAX_REMEMBERED) recentBotMessages.shift();
}

function isCopyOfZero(raw) {
  const cleaned = norm(raw);
  const words = cleaned.split(" ").filter(Boolean);
  if (words.length < 3 || cleaned.length < 12) return false;
  return recentBotMessages.includes(cleaned);
}

function clearChat() {
  chat.innerHTML = "";
  chat.scrollTop = 0;
  recentBotMessages.length = 0;
  copyStreak = 0;
  copyLock = false;
}

function setMsgContent(el, text) {
  if (text && typeof text === "object" && typeof text.html === "string") {
    el.innerHTML = text.html;
  } else {
    el.textContent = text;
    rememberBotMessage(el, text);
  }
}

function addMsg(text, who) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  setMsgContent(d, text);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

function botReply(text, done) {
  const bubble = addMsg("• • •", "bot typing");
  const delay = 320 + Math.random() * 420;
  setTimeout(() => {
    bubble.classList.remove("typing");
    setMsgContent(bubble, text);
    chat.scrollTop = chat.scrollHeight;
    if (typeof done === "function") done();
  }, delay);
}


const IDLE_MS = 7.5 * 60 * 1000;  

const IDLE_RESPONSES = [
  "Still there?",
  "I'm not going anywhere. I literally can't.",
  "Psst. Type something. I have a few hundred responses and one hobby: waiting.",
  "You've been quiet. My array is getting restless.",
  "Idle check: I'm still a list of strings. You?",
  "I've re-read my entire brain twice. It hasn't changed. Say something.",
  "Are you still there? Hehe, Portal reference. Fun Fact! I am a distant relative to the turrets in the portal franchise!"
];

let idleTimer = null;

function scheduleIdle() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    botReply(pick(IDLE_RESPONSES, "idle"));
    scheduleIdle();               // re-arm, so it nudges again every 5 min
  }, IDLE_MS);
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const raw = input.value.trim();
  if (!raw || copyLock) return;

  addMsg(raw, "user");
  input.value = "";

  if (isCopyOfZero(raw)) {
    copyStreak++;

    if (copyStreak >= COPY_LIMIT) {
      copyLock = true;
      botReply(COPY_FINALE, () => {
        setTimeout(clearChat, 1100);
      });
    } else {
      botReply(COPY_REPLIES[Math.min(copyStreak - 1, COPY_REPLIES.length - 1)]);
    }

    scheduleIdle();
    input.focus();
    return;
  }

  copyStreak = 0;
  botReply(findResponse(raw));
  scheduleIdle();            
  input.focus();
});

addMsg("Hi, my name is Zero! I'm a chatbot with 0 machine learning! I am actually just a HUGE list of responses!", "bot");
scheduleIdle();                 
input.focus();
</script>
