#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

	top: 0;
	bottom: 0;
}

#status {
	background-color: #222b3c;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;

#status-splash {
	max-height: 100%;

	bottom: 10%;

<!-- Mock Yandex platform to satisfy webbus_sdk.js and Godot -->
<script>
// Provide a fake Yandex platform object to prevent "Platform not found"
window.Ya = window.Ya || {};
window.Ya.env = window.Ya.env || {};
window.Ya.env.platform = "desktop";
window.Ya.appData = window.Ya.appData || { location: { entryQuery: {} }, abt: { flags: {} } };
window.clientMetadata = window.clientMetadata || { appId: "520333", bundle: "desktop", lang: "en" };
// Mock all ad-related functions to prevent any ad calls
window.has = window.has || function() { return false; };
window.Ya.Games = window.Ya.Games || {
    getPlayer: () => Promise.resolve({}),
    getCatalog: () => Promise.resolve({ items: [] }),
    rewardedVideo: { show: () => Promise.resolve({}), on: () => {} },
    interstitialAd: { show: () => Promise.resolve({}), on: () => {} },
    onError: () => {}
};
window.Ya.Rum = window.Ya.Rum || { logError: () => {} };
window.Ya.adv = window.Ya.adv || {
    showFullscreenAdv: () => Promise.resolve({}),
    showRewardedVideo: () => Promise.resolve({}),
    on: () => {},
    off: () => {}
};
// Mock common ad platform calls
window.ysdk = null;
window.CrazyGames = window.CrazyGames || {};
window.CrazyGames.SDK = window.CrazyGames.SDK || {
    ad: { requestAd: () => Promise.resolve(), requestBreak: () => Promise.resolve() },
    game: { gameLoadingStart: () => {}, gameLoadingStop: () => {} },
    banner: { requestBanner: () => {}, hideBanner: () => {} }
};
window.Poki = window.Poki || {
    init: () => Promise.resolve(),
    commercialBreak: () => Promise.resolve(),
    rewardedBreak: () => Promise.resolve(),
    gameLoadingFinished: () => {}
};
window.GameDistribution = window.GameDistribution || {
    on: () => {}
};
</script>

<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":4,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":9997072,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":2};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
</script>

<!-- Audio context resume on user interaction -->
<script>
    const canvas = document.getElementById('canvas');
    canvas.addEventListener('click', () => {
        if (window.AudioContext && window.audioContext) {
            window.audioContext.resume().catch(e => console.log('Audio resume failed', e));
        } else if (window.AudioContext) {
            const ctx = new AudioContext();
            ctx.resume();
        }
    });
</script>

<!-- Reduce touchpad scroll/zoom sensitivity -->
<script>
    (function() {
        var c = document.getElementById('canvas');
        var busy = false;
        c.addEventListener('wheel', function(e) {
            if (busy) return;
            e.preventDefault();
            e.stopPropagation();
            busy = true;
            c.dispatchEvent(new WheelEvent('wheel', {
                deltaX: e.deltaX * 0.05,
                deltaY: e.deltaY * 0.05,
                deltaZ: e.deltaZ * 0.05,
                deltaMode: e.deltaMode,
                ctrlKey: false,
                shiftKey: e.shiftKey,
                altKey: e.altKey,
                metaKey: e.metaKey,
                clientX: e.clientX, clientY: e.clientY,
                screenX: e.screenX, screenY: e.screenY,
                bubbles: true, cancelable: true
            }));
            busy = false;
        }, { passive: false });
    })();
</script>
