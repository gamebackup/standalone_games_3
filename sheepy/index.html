<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
	<title>SheepyAShortAdventure</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
	
	<!-- Made with Construct, the game and app creator :: https://www.construct.net -->
	<meta name="generator" content="Scirra Construct">

	<link rel="icon" type="image/png" href="icons/icon-256.png">

	<link rel="stylesheet" href="style.css">

<style>
#loading-screen {
	position: fixed;
	top: 0; left: 0; right: 0; bottom: 0;
	background: #000;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	z-index: 9999;
}
#loading-screen img {
	width: 64px;
	height: 64px;
	margin-bottom: 24px;
}
#loading-bar-bg {
	width: 256px;
	height: 6px;
	background: #333;
	border-radius: 3px;
	overflow: hidden;
}
#loading-bar {
	width: 0%;
	height: 100%;
	background: #fff;
	border-radius: 3px;
	transition: width 0.2s ease;
}
#loading-text {
	color: #888;
	font-family: sans-serif;
	font-size: 12px;
	margin-top: 12px;
}
#loading-screen.hidden {
	opacity: 0;
	pointer-events: none;
	transition: opacity 0.4s ease;
}
</style>

</head> 
 
<body>

	<div id="loading-screen">
		<img src="icons/loading-logo.png" alt="Loading">
		<div id="loading-bar-bg"><div id="loading-bar"></div></div>
		<div id="loading-text">Loading...</div>
	</div>
	
	<noscript>
		<div id="notSupportedWrap">
			<h2 id="notSupportedTitle">This content requires JavaScript</h2>
			<p class="notSupportedMessage">JavaScript appears to be disabled. Please enable it to view this content.</p>
		</div>
	</noscript>
	<script src="nw-polyfill.js"></script>
	<script src="scripts/supportcheck.js"></script>
	<script src="scripts/main.js" type="module"></script>

<script>
// Hide loading screen when game canvas becomes visible
(function() {
	var check = setInterval(function() {
		var c = document.querySelector('canvas');
		if (c && c.style.display !== 'none') {
			clearInterval(check);
			var ls = document.getElementById('loading-screen');
			if (ls) ls.classList.add('hidden');
		}
	}, 200);
})();
</script>

</body> 
</html>
