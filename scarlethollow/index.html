/* Chunked game.zip loader.
   Streams each part directly into the engine filesystem instead of merging
   every part into one giant in-memory Blob (which made the tab accumulate
   ~20 MB per part and caused the browser to abort fetches mid-download). */
(function () {
  "use strict";
  /* Fixed for this build: game.zip.part1..86, 20 MiB each except the last.
     Declaring them lets us skip the probe HEAD on part N+1, which the browser
     reported as a (harmless but noisy) 404. Set PARTS to 0 to rediscover. */
  var PARTS = 86;
  var TOTAL = 1799104983;
  var CACHE = "scarlet-hollow-demo-" + TOTAL;
  var USE_CACHE = location.search.indexOf("nocache") < 0;
  var ATTEMPTS = 6;
  var origFetch = window.fetch.bind(window);

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  var cachePromise = (function () {
    if (!USE_CACHE || !window.caches) return Promise.resolve(null);
    return caches.open(CACHE).catch(function (e) {
      console.warn("[shim] cache open failed:", e);
      return null;
    });
  })();

  window.__shim = {
    count: 0,
    total: 0,
    partName: function (i) { return "game.zip.part" + i; },

    discover: async function () {
      if (PARTS) {
        this.count = PARTS;
        this.total = TOTAL;
        return PARTS;
      }
      var head = async function (url) {
        try { return await origFetch(url, { method: "HEAD", cache: "no-store" }); }
        catch (e) { return null; }
      };
      var r = await head(this.partName(1));
      if (!r || !r.ok) return 0;
      var n = 1;
      var total = parseInt(r.headers.get("Content-Length") || "0", 10);
      while (n < 512) {
        var h = await head(this.partName(n + 1));
        if (!h || !h.ok) break;
        total += parseInt(h.headers.get("Content-Length") || "0", 10);
        n++;
      }
      this.count = n;
      this.total = total;
      return n;
    },

    part: async function (i) {
      var cache = await cachePromise;
      var key = "part:" + i;
      if (cache) {
        try {
          var hit = await cache.match(key);
          if (hit) return await hit.blob();
        } catch (e) { /* fall through to network */ }
      }
      var last = null;
      for (var a = 1; a <= ATTEMPTS; a++) {
        try {
          var res = await origFetch(this.partName(i), { cache: "no-store" });
          if (!res.ok) throw new Error("HTTP " + res.status);
          var blob = await res.blob();
          if (cache) {
            try { await cache.put(key, new Response(blob)); } catch (e) { /* quota */ }
          }
          return blob;
        } catch (e) {
          last = e;
          console.warn("[shim] " + this.partName(i) + " attempt " + a + "/" + ATTEMPTS + " failed: " + e.message);
          if (a < ATTEMPTS) await sleep(400 * a);
        }
      }
      throw new Error(this.partName(i) + " failed after " + ATTEMPTS + " attempts (" + last.message + ")");
    }
  };
})();
</script>
<script src=renpy-pre.js></script><script>
/* Replace Ren'Py's game.zip fetch with a streaming writer into the
   Emscripten filesystem. */
(function () {
  "use strict";
  var Module = window.Module || (window.Module = {});
  var pre = Module.preRun || (Module.preRun = []);
  var removed = 0;
  for (var i = pre.length - 1; i >= 0; i--) {
    if (String(pre[i]).indexOf("loadGameZip") >= 0) { pre.splice(i, 1); removed++; }
  }
  console.log("[shim] removed engine game.zip hooks:", removed);

  Module.preRun.push(function () {
    Module.addRunDependency("shim_game_zip");
    (async function () {
      function say(t) {
        var d = document.getElementById("statusDiv"), s = document.getElementById("statusTextDiv");
        if (d) d.className = t ? "visible" : "hidden";
        if (s && t) s.textContent = t;
      }
      async function pipe(stream, f) {
        var reader = stream.getReader(), n = 0;
        for (;;) {
          var r = await reader.read();
          if (r.done) break;
          FS.write(f, r.value, 0, r.value.length);
          n += r.value.length;
        }
        return n;
      }
      try {
        var s = window.__shim;
        var n = await s.discover();
        var f = FS.open("/game.zip", "w");
        var got = 0;
        if (!n) {
          say("Downloading game data...");
          var resp = await fetch("game.zip");
          if (!resp.ok) throw new Error("game.zip HTTP " + resp.status);
          got = await pipe(resp.body, f);
        } else {
          for (var i = 1; i <= n; i++) {
            say("Loading game data " + i + " / " + n);
            var blob = await s.part(i);
            got += await pipe(blob.stream(), f);
          }
        }
        FS.close(f);
        if (!got) throw new Error("wrote 0 bytes to /game.zip");
        if (n && s.total && got !== s.total) {
          console.warn("[shim] size mismatch: wrote " + got + " expected " + s.total);
        }
        console.log("[shim] wrote /game.zip: " + got + " bytes (" + (n || "unchunked") + ")");
        say("");
        Module.removeRunDependency("shim_game_zip");
      } catch (e) {
        console.error("[shim] failed:", e);
        say("Could not load game data: " + e.message + " - reload to retry");
        /* Keep the dependency: never boot Python with an empty /game.zip. */
      }
    })();
  });
})();
</script>
<script>
/* Ren'Py 8.1.3's web audio queue() dereferences a null filename during
   rewinds (doRewind), throwing "can't access property startsWith, file is null".
   Newer Ren'Py rejects that on the Python side; here we simply ignore the call. */
(function () {
  /* No time budget: renpyAudio only appears once the engine has finished
     unpacking /game.zip, which takes seconds on a warm cache but minutes on a
     cold one. A fixed give-up deadline made the guard silently expire before
     audio ever existed, so keep watching until it shows up. */
  window.__shimGuardPolls = 0;

  function install() {
    var a = window.renpyAudio;
    if (!a || typeof a.queue !== "function" || a.__shimGuarded) return false;
    var orig = a.queue;
    var warned = {};
    a.queue = function (channel, file) {
      if (file === null || file === undefined) {
        /* Rewinds hit this repeatedly, so warn once per channel. */
        if (!warned[channel]) {
          warned[channel] = true;
          console.warn("[shim] ignoring empty audio queue on channel " + channel);
        }
        return;
      }
      return orig.apply(this, arguments);
    };
    a.__shimGuarded = true;
    console.log("[shim] guarded renpyAudio.queue");
    return true;
  }

  var timer = setInterval(function () {
    window.__shimGuardPolls++;
    if (install()) clearInterval(timer);
  }, 50);
})();
</script>
